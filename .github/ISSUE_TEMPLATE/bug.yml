name: バグ報告
description: 不具合を報告する
title: "[バグ] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生している不具合を簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージやスクリーンショットがあれば添付してください。
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: 完了の定義 (DoD)
      description: どうなればこの Issue を完了として Close してよいかをチェックリストで記載してください。
      placeholder: |
        - [ ] 再現手順で不具合が発生しないこと
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 発生した環境を記載してください。
      placeholder: |
        - 実行方法: npm run dev / npm run preview / 本番
        - ブラウザ:
        - OS:
    validations:
      required: false
